# Эталонные черновики для отчёта о качестве: backend/.venv/bin/python scripts/quality_report.py
#
# facts    — сведения, которые обязаны дойти до документа (сравнение с учётом формы записи)
# fixed    — ошибка в черновике и её исправление: первого быть не должно, второе должно появиться
# forbid   — чего в документе быть не должно
# filled   — реквизиты, которые обработчик должен заполнить сам
# no_warnings — у этого случая предупреждений быть не должно

- id: typos
  doc_type: service_memo
  requisites: { recipient: Директору колледжа }
  draft: |
    Прошу сагласовать покупку двух мониторов, а то старые уже совсем плохо работают.
    Нужно 30 000 рублей. Иванов И. И. просит доставить их до 25.09.2026, только если бюджет согласуют.
  facts: ["30 000", "25.09.2026", "Иванов"]
  fixed: { сагласовать: согласовать }
  forbid: ["а то", "за единицу"]
  filled: [subject]
  no_warnings: true

- id: amount_in_words
  doc_type: report_memo
  requisites: { organization: БГИТУ, recipient: Проректору по АХЧ }
  draft: |
    Сообщаю что вчера в кабинете 204 протикла батарея, залило два стола.
    Ремонт обойдётся в пятнадцать тысяч рублей, смету составил Сидоров П. П.
  facts: ["204", "пятнадцать тысяч", "Сидоров"]
  fixed: { "Сообщаю что": "Сообщаю, что" }
  forbid: ["ежемесячно"]
  filled: [subject]

- id: condition
  doc_type: service_memo
  requisites: { recipient: Директору }
  draft: |
    Прошу закупить два монитора, но только если бюджет согласуют до 25.09.2026.
    Старые мониторы не подлежат ремонту, стоимость новых 30 000 рублей.
  facts: ["30 000", "25.09.2026"]
  keep_meaning: true
  no_warnings: true

- id: labelled_header
  doc_type: service_memo
  requisites: {}
  draft: |
    Кому: Директору колледжа Иванову И. И.
    От кого: лаборант Петрова А. А.
    Тема — закупка мониторов
    Дата: 11.09.2026

    Прошу сагласовать закупку двух мониторов, нужно 30 000 рублей до 25.09.2026.
  facts: ["30 000", "25.09.2026"]
  fixed: { сагласовать: согласовать }
  forbid: ["Кому:", "От кого:"]
  filled: [recipient, sender, subject, date]
  no_warnings: true

- id: nothing_to_invent
  doc_type: letter
  requisites: { organization: БГИТУ, recipient: "ООО «Техносервис»" }
  draft: |
    Хотим попросить вас прислать коммерческое предложение на поставку 10 компьютеров.
    Ответ ждём до 15.10.2026, контактное лицо Иванов И. И.
  facts: ["10", "15.10.2026", "Иванов"]
  forbid: ["№", "подпис"]
  empty: [number, signer, date]

- id: information_note
  doc_type: information_note
  requisites: { organization: БГИТУ, purpose: Для предъявления в бухгалтерию }
  draft: |
    Справка нужна для бухгалтерии. Студент Козлов А. В. учится на 3 курсе очно.
    Обучение платное, стоимость 120 000 рублей в год, договор от 01.09.2025.
  facts: ["120 000", "01.09.2025", "Козлов", "3"]
  forbid: ["за единицу"]
  filled: [subject]

- id: negation
  doc_type: report_memo
  requisites: { organization: БГИТУ, recipient: Ректору }
  draft: |
    Докладываю что оборудование лаборатории не подлежит ремонту и не может использоваться.
    Замена обойдётся в 480 000 рублей, поставка не раньше 01.11.2026.
  facts: ["480 000", "01.11.2026"]
  fixed: { "Докладываю что": "Докладываю, что" }
  keep_meaning: true

- id: long_draft
  doc_type: report_memo
  requisites: { organization: БГИТУ, recipient: Проректору по АХЧ }
  draft: |
    В кабинете 777 сгорел щиток, ремонт стоит 91 000 рублей.
    В кабинете 204 неисправны 4 компьютера, нужен ремонт до 10.10.2026.
    Мониторы старые, их покупали ещё в 2016 году, картинка мерцает.
    Сетевой коммутатор перегревается, из-за этого занятия дважды прерывались.
    Кондиционер не работает с июля, в кабинете душно, температура доходит до 31 градуса.
    Преподаватель Сидоров П. П. просит заменить оборудование до начала сессии.
    Смета на ремонт составляет 480 000 рублей, её подготовил инженер Кузнецов А. А.
    Отдельно нужно 45 000 рублей на кабельную проводку, работы займут неделю.
    Если денег не хватит, предлагаю сначала заменить 4 нерабочих компьютера.
    Прошу рассмотреть вопрос до 01.10.2026, иначе занятия придётся переносить.
  facts: ["777", "91 000", "480 000", "45 000", "01.10.2026", "Кузнецов", "Сидоров"]
  keep_meaning: true
