id: letter
name: Письмо
description: Официальное обращение к внешнему адресату.
title: ПИСЬМО
fields:
  - { id: organization, label: Организация отправителя, required: true, placement: letterhead }
  - { id: recipient, label: Адресат, required: true, placement: addressee }
  - { id: date, label: Дата, required: true, placement: registration }
  - { id: number, label: Исходящий номер, required: true, placement: registration, prefix: "№ " }
  - { id: subject, label: Тема, required: true, placement: headline, summary: true }
  - { id: salutation, label: Обращение, placement: salutation }
  - { id: attachment, label: Приложение, placement: paragraph, prefix: "Приложение: " }
  - { id: signer_position, label: Должность подписанта, placement: signature }
  - { id: signer, label: Подписант, required: true, placement: signature }
  - { id: executor, label: Исполнитель, placement: executor }
blocks: [organization, date, number, recipient, title, subject, salutation, body, attachment, signer_position, signer, executor]
