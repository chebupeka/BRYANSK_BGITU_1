<!-- The mark is the hero in miniature: two sheets caught mid-fall, the near one lit. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="plate" x1="5" y1="0" x2="43" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b333e"/><stop offset=".52" stop-color="#141922"/><stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="sheet" x1="18" y1="13" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#c9d1dc"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="13.5" fill="url(#plate)"/>
  <!-- A hairline around the plate: it catches the same light as the sheets. -->
  <rect x="1.75" y="1.75" width="44.5" height="44.5" rx="12.9" stroke="#fff" stroke-opacity=".15" stroke-width="1.5"/>
  <!-- The sheet further off, turned the other way and clear of the near one at the top left. -->
  <rect x="14" y="10" width="15" height="21" rx="3" fill="#fff" fill-opacity=".2" transform="rotate(-21 21.5 20.5)"/>
  <g transform="rotate(11 25.5 25.5)">
    <path d="M20 13.5h8.5l5 5V35a2.5 2.5 0 0 1-2.5 2.5H20A2.5 2.5 0 0 1 17.5 35V16A2.5 2.5 0 0 1 20 13.5Z" fill="url(#sheet)"/>
    <path d="M28.5 13.5l5 5h-3a2 2 0 0 1-2-2z" fill="#a7b3c2"/>
    <path d="M21.5 24h8M21.5 29h5.5" stroke="#3f4b5d" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
