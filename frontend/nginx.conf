server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 5s;
        # Запас на запрос к модели и один повтор на стороне backend: LLM_TIMEOUT_SECONDS
        # доходит до 180 с, и на длинном черновике запросов несколько подряд.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
